[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colpali-edge"
version = "0.1.0"
description = "Dependency-free MaxSim late-interaction, contrastive loss, pooling, and binary multi-vector indexing primitives for ColPali-style visual document retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Soumya Debnath" }]
keywords = ["colpali", "late-interaction", "maxsim", "visual-document-retrieval", "binary-quantization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
include = ["colpali_edge*"]
